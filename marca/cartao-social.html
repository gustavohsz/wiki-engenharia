<!doctype html>
<!-- Imagem de compartilhamento (1200×630). Gerada em PNG por gerar-imagens.mjs. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; }
  body {
    display: flex; flex-direction: column; justify-content: space-between;
    box-sizing: border-box; padding: 72px 80px;
    background: #185FA5; color: #ffffff;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  }
  .topo { display: flex; align-items: center; gap: 36px; }
  .logo { width: 150px; height: 150px; flex: none; }
  h1 { margin: 0; font-size: 84px; font-weight: 700; line-height: 1.05; letter-spacing: -1px; }
  .tagline { margin: 14px 0 0; font-size: 38px; color: #E6F1FB; }
  .secoes { margin: 0; font-size: 28px; color: #B5D4F4; }
  .rodape { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; }
  .url { margin: 10px 0 0; font-size: 28px; font-weight: 600; color: #FAC775; }
  .idiomas { font-size: 26px; color: #B5D4F4; }
</style>
</head>
<body>
  <div class="topo">
    <svg class="logo" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14" fill="#0C447C"/>
      <polygon points="37,7 15,37 30,37 25,57 49,25 34,25" fill="#EF9F27"/>
    </svg>
    <div>
      <h1>Wiki de Engenharia</h1>
      <p class="tagline">Engenharia elétrica com Revit e AutoCAD</p>
    </div>
  </div>
  <div class="rodape">
    <div>
      <p class="secoes">Biblioteca BIM/CAD · Catálogo · Cursos · Normas · Documentação · Cálculos</p>
      <p class="url">gustavohsz.github.io/wiki-engenharia</p>
    </div>
    <span class="idiomas">PT · EN</span>
  </div>
</body>
</html>
