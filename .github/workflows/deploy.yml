# Publica o site (pasta site/) no GitHub Pages.
# Roda a cada push na branch main que mexa em site/ ou neste arquivo,
# e também manualmente pela aba Actions ("Run workflow").
#
# Pré-requisito (uma vez, no GitHub): Settings → Pages → Source: GitHub Actions.

name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Permissões mínimas: ler o repositório e publicar no Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez. Uma nova não cancela a que já está em andamento,
# para não deixar o site pela metade.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v5

      - name: Instalar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Testes das calculadoras
        run: npm test

      - name: Build (português e inglês)
        run: npm run build

      # Em pull requests só o build é testado; nada é publicado.
      - name: Enviar o site gerado
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/build

  deploy:
    name: Publicar
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
